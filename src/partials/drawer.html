<div class="drawer" id="basket" data-drawer hidden>
  <div class="drawer__scrim" data-drawer-close></div>
  <aside class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="basket-title">
    <div class="drawer__head">
      <h2 class="title" id="basket-title">Your enquiry</h2>
      <button class="drawer__close" type="button" aria-label="Close enquiry basket" data-drawer-close><svg aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="drawer__body" data-drawer-list></div>
    <div class="drawer__foot">
      <p class="note">No payment is taken. Your selection is sent as an enquiry and the studio replies with availability and a tailored proposal.</p>
      <a class="btn btn--primary" href="enquiry.html" data-drawer-cta>Review &amp; send enquiry</a>
    </div>
  </aside>
</div>
<div class="toast" role="status" aria-live="polite" data-toast><span data-toast-text></span><button type="button" data-basket-open>View enquiry</button></div>
